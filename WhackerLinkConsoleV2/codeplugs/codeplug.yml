qcList:
  # Quick Call II tone pairs; shown on the main window as alert tone tiles.
  # name is optional, when omitted the tile labels itself as "QC2 <a>/<b>"
  - name: "City Fire HQ"
    a: 1006.9
    b: 457.9
  - name: "County Fire"
    a: 855.5
    b: 349.0
  - a: 877.5
    b: 501.1

zones:
  - name: "Zone 1"
    channels:
      - name: "Channel 1"
        system: "System 1"
        tgid: "2001"
        keyId: 0x50
        algoId: 0xaa # 0xAA or 0x84 (RC4 or AES)
        encryptionKey: null # Ignored now, we use dvmfne KMM support
      - name: "Channel 2"
        system: "System 1"
        tgid: "15002"
      - name: "Channel 3"
        system: "System 1"
        tgid: "15003"

  - name: "Zone 2"
    channels:
      - name: "Channel A"
        system: "System 1"
        tgid: "16001"
      - name: "Channel B"
        system: "System 1"
        tgid: "16002"
      - name: "Channel C"
        system: "System 1"
